<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fairouz's Study Pages</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Home: one tile per week page, newest week first. Same tokens and tiles as the study pages. */
:root {
  --bg: #FBFDFC; --card: #FFFFFF; --ink: #17323A; --muted: #5E777B; --line: #E1ECE7;
  --pond: #2F5DB0; --pond-ink: #FFFFFF; --sun: #E9A800;
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Andika", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1D21; --card: #16282D; --ink: #E6F2EE; --muted: #9FB8B3; --line: #26403F;
    --pond: #8DB0FF; --pond-ink: #0B1730; --sun: #FFC93C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1D21; --card: #16282D; --ink: #E6F2EE; --muted: #9FB8B3; --line: #26403F;
  --pond: #8DB0FF; --pond-ink: #0B1730; --sun: #FFC93C; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1.4rem; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--pond); }
.wrap { max-width: 660px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--pond); color: var(--pond-ink); }
.top .wrap { display: flex; align-items: center; min-height: 68px; font-size: 1.8rem; }
main { padding-block: 36px 72px; display: grid; gap: 32px; }
.hi { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 2.4rem; text-align: center; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.tile { display: grid; justify-items: center; gap: 6px; padding: 20px 12px; min-height: 150px; border-radius: 24px; border: 2px solid var(--line); background: var(--card); color: inherit; text-align: center; text-decoration: none; }
.tile:hover { border-color: var(--pond); }
.tile:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.tile .emo { font-size: 3rem; line-height: 1.1; }
.tile .name { font-family: var(--f-display); font-weight: 600; font-size: 1.35rem; line-height: 1.2; }
.tile .meta { color: var(--muted); font-size: 1rem; }
@media (max-width: 480px) {
  .hi { font-size: 2rem; }
  .tiles { grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { min-height: 130px; padding: 16px 8px; }
  .tile .emo { font-size: 2.5rem; }
  .tile .name { font-size: 1.15rem; }
}
</style>

</head>
<body>
<header class="top"><div class="wrap"><span aria-hidden="true">📚</span></div></header>
<main class="wrap">
  <h1 class="hi">Hi Fairouz! 👋</h1>
  <!-- Newest week first. New week = new <subject>-w<NN>.html file + one tile here; never overwrite an old week. -->
  <nav class="tiles" aria-label="Study pages">
    <a class="tile" href="math-w11.html"><span class="emo" aria-hidden="true">🧮</span><span class="name">Math</span><span class="meta">Week 11</span></a>
    <a class="tile" href="math-w10.html"><span class="emo" aria-hidden="true">🧮</span><span class="name">Math</span><span class="meta">Week 10</span></a>
    <a class="tile" href="science-w10.html"><span class="emo" aria-hidden="true">🐸</span><span class="name">Science</span><span class="meta">Week 10</span></a>
  </nav>
</main>

</body>
</html>
